<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>POSTECH - 통합로그인</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="page-topline" aria-hidden="true"></div>
  <main class="page">
    <section class="shell" aria-labelledby="login-title">
      <div class="login-panel">
        <header class="panel-header">
          <div class="lang-switch" aria-label="Language selector">
            <a href="#" class="lang-chip is-active">KOR</a>
            <a href="#" class="lang-chip">ENG</a>
          </div>

          <div class="hero-brand">
            <img src="./logo-mark.png" alt="POSTECH anniversary style logo" class="brand-image">
          </div>
        </header>

        <div class="title-lockup">
          <h1 id="login-title">통합로그인</h1>
          <p class="panel-subtitle panel-subtitle-strong">POSTECH</p>
        </div>

        <form id="login-form" class="login-form">
          <label class="field">
            <span class="visually-hidden">해모수 ID</span>
            <input
              type="text"
              name="userId"
              placeholder="아이디"
              autocomplete="username"
            >
          </label>

          <label class="field">
            <span class="visually-hidden">비밀번호</span>
            <input
              type="password"
              name="password"
              placeholder="비밀번호"
              autocomplete="current-password"
            >
          </label>

          <button type="submit" class="login-button">로그인</button>

          <div class="utility-row">
            <label class="checkline">
              <input type="checkbox" name="rememberId">
              <span>아이디 정보 저장</span>
            </label>
          </div>
        </form>

        <nav class="bottom-links" aria-label="계정 관련 메뉴">
          <a href="#" class="icon-link">
            <span class="icon-circle user-plus" aria-hidden="true"></span>
            <span>계정 등록</span>
          </a>
          <a href="#" class="icon-link">
            <span class="icon-circle lock-icon" aria-hidden="true"></span>
            <span>비밀번호 변경</span>
          </a>
          <a href="#" class="icon-link">
            <span class="icon-circle shield-icon" aria-hidden="true"></span>
            <span>2차 인증 등록 안내</span>
          </a>
        </nav>
      </div>
    </section>

    <footer class="footer">
      <p>(37673) 경상북도 포항시 남구 청암로 77(효자동 산31) TEL. 054-279-2520</p>
      <p>COPYRIGHT Pohang University of Science and Technology. ALL RIGHTS RESERVED.</p>
    </footer>
  </main>

  <script src="./main.js" defer></script>
</body>
</html>
