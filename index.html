<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>POSTECH - 통합로그인</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="page">
    <section class="hero" aria-labelledby="login-title">
      <div class="hero-brand">
        <p class="brand-title">POSTECH</p>
        <p class="brand-subtitle">POHANG UNIVERSITY OF SCIENCE AND TECHNOLOGY</p>
      </div>

      <div class="login-panel">
        <div class="panel-topline">
          <span>POSTECH 구성원 서비스</span>
          <span class="divider" aria-hidden="true"></span>
          <span>POSTECH MEMBER SERVICE</span>
        </div>

        <h1 id="login-title">통합로그인</h1>
        <p class="panel-subtitle">Single Sign-On</p>

        <form id="login-form" class="login-form">
          <label class="field">
            <span class="visually-hidden">해모수 ID</span>
            <input
              type="text"
              name="userId"
              placeholder="아이디"
              autocomplete="username"
            >
          </label>

          <label class="field">
            <span class="visually-hidden">비밀번호</span>
            <input
              type="password"
              name="password"
              placeholder="Password"
              autocomplete="current-password"
            >
          </label>

          <button type="submit" class="login-button">로그인</button>

          <div class="utility-row">
            <label class="checkline">
              <input type="checkbox" name="rememberId">
              <span>아이디 저장</span>
            </label>

            <div class="utility-links">
              <a href="#">계정지원</a>
            </div>
          </div>
        </form>
      </div>
    </section>

    <footer class="footer">
      <p>(37673) 경상북도 포항시 남구 청암로 77(효자동 산31)</p>
      <p>77 Cheongam-Ro, Nam-Gu, Pohang, Gyeongbuk, Korea 37673</p>
      <p>COPYRIGHT Pohang University of Science and Technology. ALL RIGHTS RESERVED.</p>
    </footer>
  </main>

  <script src="./main.js" defer></script>
</body>
</html>
